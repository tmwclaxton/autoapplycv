<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>LinkedIn Easy Apply - SDUI radios without fieldset</title>
        <style>
            .fb-form-element__checkbox {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
                opacity: 0;
            }
        </style>
    </head>
    <body>
        <!--
  Live LinkedIn 2026 SDUI (Gravitas / causaLens post-2.25.365):
  Yes/No groups often omit <fieldset>/<legend>. Question text lives on a title
  span inside .fb-dash-form-element; option rows are sibling .display-flex divs.
  Old getRadiogroupLabel(input) did closest('div') → option row → label "Yes",
  then labelIdentity collapsed every group into one field.
-->
        <div
            role="dialog"
            aria-modal="true"
            class="artdeco-modal"
            style="
                position: fixed;
                inset: 40px;
                z-index: 9999;
                background: #fff;
                display: block;
            "
        >
            <h2 id="jobs-apply-header">Apply to causaLens</h2>
            <p>3/4 pages</p>
            <div class="artdeco-modal__content">
                <h3>Additional Questions</h3>

                <div
                    data-test-form-element=""
                    class="fb-dash-form-element"
                    style="width: 100%"
                    tabindex="-1"
                >
                    <span
                        data-test-form-builder-radio-button-form-component__title=""
                        class="fb-dash-form-element__label fb-dash-form-element__label-title--is-required"
                    >
                        Are you legally authorized to work in United Kingdom?*
                    </span>
                    <div
                        data-test-text-selectable-option="0"
                        class="display-flex"
                    >
                        <input
                            data-test-text-selectable-option__input="Yes"
                            id="rtw-yes"
                            class="fb-form-element__checkbox"
                            name="urn:li:fsd_formElement:rtw"
                            type="radio"
                            value="on"
                        />
                        <label
                            data-test-text-selectable-option__label="Yes"
                            for="rtw-yes"
                            class="t-14"
                            >Yes</label
                        >
                    </div>
                    <div
                        data-test-text-selectable-option="1"
                        class="display-flex"
                    >
                        <input
                            data-test-text-selectable-option__input="No"
                            id="rtw-no"
                            class="fb-form-element__checkbox"
                            name="urn:li:fsd_formElement:rtw"
                            type="radio"
                            value="on"
                        />
                        <label
                            data-test-text-selectable-option__label="No"
                            for="rtw-no"
                            class="t-14"
                            >No</label
                        >
                    </div>
                </div>

                <div
                    data-test-form-element=""
                    class="fb-dash-form-element mt4"
                    style="width: 100%"
                    tabindex="-1"
                >
                    <span
                        data-test-form-builder-radio-button-form-component__title=""
                        class="fb-dash-form-element__label fb-dash-form-element__label-title--is-required"
                    >
                        Are you comfortable working in a hybrid setting?*
                    </span>
                    <div
                        data-test-text-selectable-option="0"
                        class="display-flex"
                    >
                        <input
                            data-test-text-selectable-option__input="Yes"
                            id="hybrid-yes"
                            class="fb-form-element__checkbox"
                            name="urn:li:fsd_formElement:hybrid"
                            type="radio"
                            value="on"
                        />
                        <label
                            data-test-text-selectable-option__label="Yes"
                            for="hybrid-yes"
                            class="t-14"
                            >Yes</label
                        >
                    </div>
                    <div
                        data-test-text-selectable-option="1"
                        class="display-flex"
                    >
                        <input
                            data-test-text-selectable-option__input="No"
                            id="hybrid-no"
                            class="fb-form-element__checkbox"
                            name="urn:li:fsd_formElement:hybrid"
                            type="radio"
                            value="on"
                        />
                        <label
                            data-test-text-selectable-option__label="No"
                            for="hybrid-no"
                            class="t-14"
                            >No</label
                        >
                    </div>
                </div>

                <div
                    data-test-form-element=""
                    class="fb-dash-form-element mt4"
                    style="width: 100%"
                    tabindex="-1"
                >
                    <span
                        data-test-form-builder-radio-button-form-component__title=""
                        class="fb-dash-form-element__label fb-dash-form-element__label-title--is-required"
                    >
                        Will you now or in the future require sponsorship for
                        employment visa status?*
                    </span>
                    <div
                        data-test-text-selectable-option="0"
                        class="display-flex"
                    >
                        <input
                            data-test-text-selectable-option__input="Yes"
                            id="sponsor-yes"
                            class="fb-form-element__checkbox"
                            name="urn:li:fsd_formElement:sponsor"
                            type="radio"
                            value="on"
                        />
                        <label
                            data-test-text-selectable-option__label="Yes"
                            for="sponsor-yes"
                            class="t-14"
                            >Yes</label
                        >
                    </div>
                    <div
                        data-test-text-selectable-option="1"
                        class="display-flex"
                    >
                        <input
                            data-test-text-selectable-option__input="No"
                            id="sponsor-no"
                            class="fb-form-element__checkbox"
                            name="urn:li:fsd_formElement:sponsor"
                            type="radio"
                            value="on"
                        />
                        <label
                            data-test-text-selectable-option__label="No"
                            for="sponsor-no"
                            class="t-14"
                            >No</label
                        >
                    </div>
                </div>
            </div>
            <div class="artdeco-modal__actionbar">
                <button
                    type="button"
                    class="artdeco-button--primary"
                    aria-label="Review your application"
                >
                    Review
                </button>
            </div>
        </div>
    </body>
</html>
